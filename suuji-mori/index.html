<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>すうじのもり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="style.css">

<div class="app">
  <div class="bar">
    <button class="round-btn" id="homeBtn" aria-label="はじめのがめんへ" hidden>🏠</button>
    <div class="stars" id="stars" aria-label="このかいのほし" hidden></div>
    <div class="spacer" id="spacer"></div>
    <button class="gear" id="gear" aria-label="おうちのかたへ（ながおし）">
      <svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"></circle></svg>
      おとな<br>ながおし
    </button>
  </div>
  <div class="guide">
    <button class="owl" id="owl" aria-label="もういちど きく">🦉</button>
    <div class="bubble" id="bubble" aria-live="polite">なにして あそぶ？</div>
  </div>
  <main class="stage" id="stage"></main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheetIn"></div>
</div>

<script src="voice/clips.js"></script>
<script src="data.js"></script>
<script src="lines.js"></script>
<script src="glyphs.js"></script>
<script src="app.js"></script>
